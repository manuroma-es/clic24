<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 300" width="160" height="300">
  <title>Etiqueta de cartón kraft</title>
  <defs>
    <linearGradient id="et-kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2B184"/>
      <stop offset=".55" stop-color="#BE9A6A"/>
      <stop offset="1" stop-color="#9E7A4E"/>
    </linearGradient>
    <radialGradient id="et-ring" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#E2CDA6"/>
      <stop offset="1" stop-color="#A8865A"/>
    </radialGradient>
    <filter id="et-fibra" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9 .35" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .12  0 0 0 .22 0" result="c"/>
      <feComposite in="c" in2="SourceGraphic" operator="in" result="t"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge>
    </filter>
  </defs>
  <g id="etiqueta">
    <!-- cuerpo: rectángulo con esquinas superiores achaflanadas, agujero pasante -->
    <path id="carton" filter="url(#et-fibra)" fill="url(#et-kraft)" stroke="#7E5E38" stroke-width="1.2" fill-rule="evenodd"
      d="M40 52h80l28 30v196a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8V82z M80 68a7 7 0 1 0 0 14a7 7 0 1 0 0-14z"/>
    <path d="M16 280h128" stroke="#7E5E38" stroke-width="1" opacity=".25"/>
    <!-- refuerzo del agujero -->
    <path id="refuerzo" fill="url(#et-ring)" stroke="#8A6A42" stroke-width="1" fill-rule="evenodd"
      d="M80 60a15 15 0 1 0 0 30a15 15 0 1 0 0-30z M80 68a7 7 0 1 0 0 14a7 7 0 1 0 0-14z"/>
    <circle cx="80" cy="75" r="7.6" fill="none" stroke="#6E5030" stroke-width="1.2" opacity=".7"/>
    <!-- cordel -->
    <g id="cordel" fill="none" stroke-linecap="round">
      <path d="M80 2c-3 20 4 40-4 70" stroke="#8C7350" stroke-width="3"/>
      <path d="M80 2c-3 20 4 40-4 70" stroke="#D9C49C" stroke-width="1.2" stroke-dasharray="3 3"/>
      <path d="M82 2c6 22 2 44 3 70" stroke="#7A6244" stroke-width="3"/>
      <path d="M82 2c6 22 2 44 3 70" stroke="#CDB68C" stroke-width="1.2" stroke-dasharray="3 3"/>
    </g>
  </g>
</svg>
