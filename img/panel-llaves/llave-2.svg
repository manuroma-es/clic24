<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 520" width="200" height="520">
  <title>Llave de seguridad de puntos (Seguridad)</title>
  <defs>
    <linearGradient id="k2-brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E4416"/>
      <stop offset=".2" stop-color="#A9822F"/>
      <stop offset=".4" stop-color="#F3D58A"/>
      <stop offset=".6" stop-color="#C9A24A"/>
      <stop offset="1" stop-color="#5A4014"/>
    </linearGradient>
    <linearGradient id="k2-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D58A"/>
      <stop offset=".4" stop-color="#C9A24A"/>
      <stop offset=".8" stop-color="#85621F"/>
      <stop offset="1" stop-color="#4E3810"/>
    </linearGradient>
    <radialGradient id="k2-dimple" cx=".62" cy=".65" r=".7">
      <stop offset="0" stop-color="#F3D58A"/>
      <stop offset=".45" stop-color="#9C7730"/>
      <stop offset="1" stop-color="#4A3410"/>
    </radialGradient>
  </defs>
  <g id="llave" class="llave">
    <g id="ring" class="ring">
      <!-- cabeza rectangular redondeada con agujero (centro 100,70 · r 22) -->
      <path fill="url(#k2-head)" stroke="#4A3410" stroke-width="1.6" fill-rule="evenodd"
        d="M84 16h32c22 0 38 16 38 38v50c0 22-16 38-38 38H84c-22 0-38-16-38-38V54c0-22 16-38 38-38z M100 48a22 22 0 1 0 0 44a22 22 0 1 0 0-44z"/>
      <rect x="56" y="26" width="88" height="106" rx="28" fill="none" stroke="#4A3410" stroke-width="1.3" opacity=".5"/>
      <rect x="58" y="28" width="84" height="102" rx="26" fill="none" stroke="#F3D58A" stroke-width=".8" opacity=".4"/>
      <!-- grabado: escudo -->
      <path d="M100 103l11 4v8c0 7-5 11-11 13-6-2-11-6-11-13v-8z" fill="none" stroke="#4A3410" stroke-width="1.6" opacity=".7"/>
      <path d="M95 115l4 4 7-8" fill="none" stroke="#4A3410" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
      <path d="M62 44c4-12 14-18 26-18" fill="none" stroke="#FFF3CF" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
    </g>
    <g id="key" class="key">
      <!-- tope / hombro -->
      <path fill="url(#k2-brass)" stroke="#4A3410" stroke-width="1.4" d="M72 140h56v10l-6 12H78l-6-12z"/>
      <!-- hoja plana -->
      <path fill="url(#k2-brass)" stroke="#4A3410" stroke-width="1.4" stroke-linejoin="round"
        d="M80 160h40v290c0 10-8 20-20 26-12-6-20-16-20-26z"/>
      <path d="M100 168v290" stroke="#4A3410" stroke-width="1.2" opacity=".45"/>
      <path d="M86 170v270" stroke="#FFF3CF" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
      <!-- puntos (dimples) -->
      <g stroke="#4A3410" stroke-width=".8" fill="url(#k2-dimple)">
        <circle cx="91" cy="190" r="5.5"/><circle cx="109" cy="214" r="4.5"/>
        <circle cx="91" cy="240" r="4"/><circle cx="109" cy="266" r="6"/>
        <circle cx="91" cy="292" r="5"/><circle cx="109" cy="318" r="4"/>
        <circle cx="91" cy="344" r="6"/><circle cx="109" cy="370" r="5"/>
        <circle cx="91" cy="396" r="4.5"/><circle cx="109" cy="420" r="5.5"/>
        <circle cx="100" cy="446" r="3.5"/>
      </g>
    </g>
  </g>
</svg>
