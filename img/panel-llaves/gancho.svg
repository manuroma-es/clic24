<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <title>Gancho de latón con roseta</title>
  <defs>
    <radialGradient id="g-plate" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#F3D58A"/>
      <stop offset=".45" stop-color="#C9A24A"/>
      <stop offset="1" stop-color="#5A4014"/>
    </radialGradient>
    <linearGradient id="g-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E4416"/>
      <stop offset=".4" stop-color="#F3D58A"/>
      <stop offset=".7" stop-color="#C9A24A"/>
      <stop offset="1" stop-color="#5A4014"/>
    </linearGradient>
  </defs>
  <g id="gancho">
    <ellipse cx="42" cy="40" rx="30" ry="30" fill="#000" opacity=".35"/>
    <circle id="roseta" cx="40" cy="36" r="28" fill="url(#g-plate)" stroke="#4A3410" stroke-width="1.4"/>
    <circle cx="40" cy="36" r="22" fill="none" stroke="#4A3410" stroke-width="1" opacity=".45"/>
    <circle cx="40" cy="36" r="23.5" fill="none" stroke="#F3D58A" stroke-width=".7" opacity=".5"/>
    <!-- tornillos -->
    <g stroke="#4A3410" stroke-width="1">
      <circle cx="40" cy="16" r="3.6" fill="#B08A3A"/><circle cx="40" cy="56" r="3.6" fill="#B08A3A"/>
    </g>
    <path d="M37.6 16h4.8M37.6 56h4.8" stroke="#3A280A" stroke-width="1.2"/>
    <!-- vástago y gancho -->
    <path id="brazo" d="M40 34v52c0 12 18 12 18 0v-8" fill="none" stroke="#4A3410" stroke-width="11" stroke-linecap="round"/>
    <path d="M40 34v52c0 12 18 12 18 0v-8" fill="none" stroke="url(#g-bar)" stroke-width="8.4" stroke-linecap="round"/>
    <path d="M38 38v46" stroke="#FFF3CF" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
    <circle cx="58" cy="76" r="5.4" fill="url(#g-plate)" stroke="#4A3410" stroke-width="1.2"/>
    <circle cx="40" cy="36" r="7" fill="url(#g-plate)" stroke="#4A3410" stroke-width="1.2"/>
  </g>
</svg>
