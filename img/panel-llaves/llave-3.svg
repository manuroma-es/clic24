<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 520" width="200" height="520">
  <title>Llave de serreta tipo Yale (Copias de llaves)</title>
  <defs>
    <linearGradient id="k3-brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E4416"/>
      <stop offset=".22" stop-color="#A9822F"/>
      <stop offset=".42" stop-color="#F3D58A"/>
      <stop offset=".6" stop-color="#C9A24A"/>
      <stop offset="1" stop-color="#5A4014"/>
    </linearGradient>
    <linearGradient id="k3-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D58A"/>
      <stop offset=".4" stop-color="#C9A24A"/>
      <stop offset=".8" stop-color="#85621F"/>
      <stop offset="1" stop-color="#4E3810"/>
    </linearGradient>
  </defs>
  <g id="llave" class="llave">
    <g id="ring" class="ring">
      <!-- cabeza tipo Yale con agujero (centro 100,70 · r 22) -->
      <path fill="url(#k3-head)" stroke="#4A3410" stroke-width="1.6" fill-rule="evenodd"
        d="M100 22c34 0 60 22 60 54 0 26-16 44-34 54l-4 18H78l-4-18c-18-10-34-28-34-54 0-32 26-54 60-54z M100 48a22 22 0 1 0 0 44a22 22 0 1 0 0-44z"/>
      <path d="M60 104c10 18 26 26 40 26s30-8 40-26" fill="none" stroke="#4A3410" stroke-width="1.3" opacity=".5"/>
      <g fill="none" stroke="#4A3410" stroke-width="1.2" opacity=".45">
        <path d="M58 70h10M132 70h10"/>
      </g>
      <path d="M58 58c6-16 22-26 40-27" fill="none" stroke="#FFF3CF" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
    </g>
    <g id="key" class="key">
      <g transform="translate(200 0) scale(-1 1)">
      <!-- hoja con hombro y dentado (serreta); el grupo interno se refleja para dejar los dientes a la izquierda, visibles junto a la etiqueta -->
      <path fill="url(#k3-brass)" stroke="#4A3410" stroke-width="1.4" stroke-linejoin="round"
        d="M78 146h48v20h-4v20l-8 12 8 12v14l-10 14 10 12v10l-12 16 12 14v18l-8 10 8 12v16l-10 14 10 12v22l-6 10 6 10v24c0 10-8 26-28 36H82c-3 0-4-2-4-4z"/>
      <!-- tope del hombro -->
      <path d="M78 166h44" stroke="#4A3410" stroke-width="1.2" opacity=".6"/>
      <!-- ranuras longitudinales -->
      <path d="M90 172v290" stroke="#4A3410" stroke-width="2.2" stroke-linecap="round" opacity=".45"/>
      <path d="M102 172v260" stroke="#4A3410" stroke-width="1.6" stroke-linecap="round" opacity=".35"/>
      <path d="M93 172v290" stroke="#FFF3CF" stroke-width="1" stroke-linecap="round" opacity=".45"/>
      <path d="M84 172v300" stroke="#FFF3CF" stroke-width="1.2" stroke-linecap="round" opacity=".35"/>
      </g>
    </g>
  </g>
</svg>
