<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="none">
  <title>Tablero de nogal</title>
  <defs>
    <linearGradient id="pn-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E1D12"/>
      <stop offset=".5" stop-color="#2A1B12"/>
      <stop offset="1" stop-color="#1F140C"/>
    </linearGradient>
    <filter id="pn-veta" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- vetas largas (claras, nogal #5A3A22) -->
      <feTurbulence type="fractalNoise" baseFrequency=".0018 .045" numOctaves="3" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .353  0 0 0 0 .227  0 0 0 0 .133  1.3 0 0 0 -.58" result="v"/>
      <!-- vetas oscuras -->
      <feTurbulence type="fractalNoise" baseFrequency=".003 .08" numOctaves="2" seed="29" stitchTiles="stitch" result="d"/>
      <feColorMatrix in="d" type="matrix" values="0 0 0 0 .07  0 0 0 0 .04  0 0 0 0 .02  1.4 0 0 0 -.62" result="dv"/>
      <!-- poro fino -->
      <feTurbulence type="fractalNoise" baseFrequency=".015 .8" numOctaves="1" seed="3" stitchTiles="stitch" result="f"/>
      <feColorMatrix in="f" type="matrix" values="0 0 0 0 .06  0 0 0 0 .035  0 0 0 0 .02  0 0 0 .22 0" result="fi"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="v"/><feMergeNode in="dv"/><feMergeNode in="fi"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#pn-base)" filter="url(#pn-veta)"/>
</svg>
